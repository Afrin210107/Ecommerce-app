<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart — Thread & Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="/" class="logo">Thread & Co.</a>
    <nav>
      <a href="/">Continue Shopping</a>
    </nav>
  </header>

  <section class="cart-page">
    <h1>Your Cart</h1>
    <div id="cartItems"></div>
    <div class="cart-summary">
      <div class="total-row">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button class="add-btn" id="checkoutBtn">Checkout</button>
    </div>
  </section>

  <script src="script.js"></script>
  <script src="cart.js"></script>
</body>
</html>
