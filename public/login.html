<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Thread & Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="/" class="logo">Thread & Co.</a>
    <nav><a href="/register.html">Create Account</a></nav>
  </header>

  <section class="auth-page">
    <h1>Welcome back</h1>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="add-btn">Log In</button>
      <p id="errorMsg" class="error-msg"></p>
    </form>
  </section>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
